[project]
name = "cloudvault"
version = "0.1.0"
description = "CloudVault — Secure Cloud File Manager"
requires-python = ">=3.12"
license = "MIT"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.12",
    "boto3>=1.35.0",
    "aiobotocore>=2.15.0",
    "celery[redis]>=5.4.0",
    "redis>=5.1.0",
    "python-magic>=0.4.27",
    "aiofiles>=24.1.0",
    "cryptography>=43.0.0",
    "httpx>=0.27.0",
    "python-magic-bin>=0.4.14; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "moto[s3,server]>=5.0.0",
    "fakeredis>=2.25.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
    "factory-boy>=3.3.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "T20"]
ignore = ["S101", "S105", "S106"]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S104"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
